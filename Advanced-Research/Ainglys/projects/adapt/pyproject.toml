[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt"
version = "0.1.0"
description = "AdaptiveMetaLearn (AML) - Self-Evolving ML Systems with Granular Arithmetic"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NeuralBlitz", email = "research@neuralblitz.ai"}]
keywords = ["machine-learning", "meta-learning", "adaptive-systems", "granular-arithmetic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
]
