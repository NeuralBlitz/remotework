[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-coder"
version = "0.1.0"
description = "Qwen3 Coder Research Frameworks Collection - 52 ML/AI Research Papers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Qwen Research Team"}]
keywords = ["machine-learning", "ai", "research", "qwen", "coder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
