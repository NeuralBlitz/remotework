[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glm-47"
version = "0.1.0"
description = "GLM-4.7 Research Frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24.0", "torch>=2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
