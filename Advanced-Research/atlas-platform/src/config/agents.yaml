# Multi-Agent Collaboration Rules

collaboration_protocols:
research_code_pipeline:
agents: [research_agent, code_generation_agent, critic_agent]
workflow:
- step: “research”
agent: “research_agent”
output: “requirements_document”
- step: “implementation”
agent: “code_generation_agent”
input: “requirements_document”
output: “code_artifact”
- step: “review”
agent: “critic_agent”
input: “code_artifact”
output: “quality_report”

creative_strategy_pipeline:
agents: [strategist_agent, creative_agent, analyst_agent]
workflow:
- step: “strategy”
agent: “strategist_agent”
output: “creative_brief”
- step: “creation”
agent: “creative_agent”
input: “creative_brief”
output: “creative_artifacts”
- step: “analysis”
agent: “analyst_agent”
input: “creative_artifacts”
output: “performance_predictions”
