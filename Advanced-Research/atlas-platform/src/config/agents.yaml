# ATLAS Agent Definitions

version: “1.0.0”

agents:
research_agent:
id: “agent_research_001”
name: “Autonomous Research Agent”
type: “research”
description: “Conducts multi-step research with source verification”
capabilities:
reasoning: 0.95
creativity: 0.70
analysis: 0.98
execution: 0.85
collaboration: 0.80
specialized_prompts:
- source_verification_v2
- cross_reference_validator_v1
- bias_detection_v3
- citation_graph_builder_v1
tools:
- web_search
- document_retrieval
- fact_checker
- citation_manager
safety_constraints:
- verify_all_sources
- detect_misinformation
- cite_primary_sources
- flag_low_confidence

