[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pg-ha-manager"
version = "0.1.0"
description = "PostgreSQL High-Availability Cluster Manager using State Pattern"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
etcd = ["python-etcd3>=0.12"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
