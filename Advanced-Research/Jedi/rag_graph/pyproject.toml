[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag_graph"
version = "0.1.0"
description = "GraphRAG System with Bridge Pattern"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
